apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-workload
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pankajdsgithub/argocd-gitops-platform.git
    targetRevision: main
    path: workloads/sample
  destination:
    server: https://kubernetes.default.svc
    namespace: default
